<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <meta name="description" content="Galerie publique de photos et vidéos">
  <title>Media Grid</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <button id="openComposer" class="floatingPlus" aria-label="Publier">+</button>

  <main>
    <section id="feed" class="feed" aria-live="polite"></section>
    <div id="status" class="status">Connexion…</div>
  </main>

  <div id="composerBackdrop" class="backdrop hidden">
    <section class="composer" role="dialog" aria-modal="true" aria-labelledby="composerTitle">
      <div class="composerHead">
        <h1 id="composerTitle">Publier</h1>
        <button id="closeComposer" class="iconBtn" aria-label="Fermer">×</button>
      </div>

      <div class="formatTabs">
        <button class="formatTab active" data-mode="auto">Auto</button>
        <button class="formatTab" data-mode="iframe">Iframe / Embed</button>
        <button class="formatTab" data-mode="bbcode">BBCode</button>
        <button class="formatTab" data-mode="url">URL</button>
      </div>

      <label for="mediaCode">Colle ton code ou ton lien</label>
      <textarea id="mediaCode" rows="8" spellcheck="false" placeholder="Exemples :
https://site.com/photo.jpg
https://site.com/video.mp4
<iframe src=&quot;https://...&quot;></iframe>
[img]https://site.com/photo.jpg[/img]
[video]https://site.com/video.mp4[/video]"></textarea>

      <div id="composerMessage" class="message"></div>
      <div id="preview" class="preview"></div>

      <div class="composerActions">
        <button id="previewBtn" class="secondaryBtn">Aperçu</button>
        <button id="publishBtn" class="primaryBtn">Publier</button>
      </div>
    </section>
  </div>

  <script src="firebase-config.js"></script>
  <script type="module" src="script.js"></script>
</body>
</html>
